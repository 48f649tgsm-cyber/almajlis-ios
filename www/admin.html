<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>إدارة المجلس</title>
  <script src="supabase.js"></script>
  <style>
    :root{--navy:#071d35;--navy2:#0d2b4c;--gold:#c99b42;--paper:#f5f2ec;--ink:#152235;--muted:#718096;--red:#b42318;--green:#16794b;--line:#dfe5ec}
    *{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink)}button,input,select,textarea{font:inherit}
    .hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#173d64,var(--navy) 55%);padding:20px}
    .login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 25px 70px #0007;text-align:center}.brand{color:var(--gold);font-size:38px;font-weight:900}.sub{color:var(--muted);margin:8px 0 24px}
    label{display:block;text-align:right;font-weight:700;margin:12px 0 6px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;font-weight:800;background:var(--navy2);color:#fff}.btn.gold{background:var(--gold);color:#10243a}.btn.red{background:#fff0ef;color:var(--red)}.btn.green{background:#e8f7ef;color:var(--green)}.btn.small{padding:7px 10px;font-size:13px}
    .shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.side{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto}.side .brand{padding:0 10px 18px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cbd8e5;text-align:right;padding:12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff}.main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:24px}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h1{margin:0;font-size:26px}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:0 4px 16px #14304b0a}.stat b{font-size:30px;color:var(--navy2)}.stat span{display:block;color:var(--muted);margin-top:6px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar .field{width:auto;min-width:180px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#f8fafc;font-size:13px;color:#536477}.badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#edf2f7}.badge.on{background:#e6f7ee;color:var(--green)}.badge.off{background:#fff0ef;color:var(--red)}.actions{display:flex;gap:6px;flex-wrap:wrap}
    .modal{position:fixed;inset:0;background:#06182bba;display:grid;place-items:center;padding:18px;z-index:30}.dialog{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:22px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.toast{position:fixed;left:20px;bottom:20px;background:#132c47;color:#fff;padding:13px 18px;border-radius:12px;z-index:50;max-width:420px}.empty{padding:34px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:9px;font-size:12px}.stats{grid-template-columns:1fr 1fr}.top{position:static}.content{padding:14px}}
  </style>
</head>
<body>
<section id="adminLoading" class="login"><div class="login-card"><div class="brand">المجلس</div><div class="sub">جارٍ فتح لوحة الإدارة…</div><p id="adminLoadMsg" class="sub"></p><button id="adminLoadBack" type="button" class="btn hidden" style="width:100%">العودة إلى شاشة الدخول</button></div></section>
<section id="app" class="shell hidden"><aside class="side"><div class="brand">المجلس</div><nav class="nav" id="nav"></nav></aside><main class="main"><header class="top"><b id="pageTitle">لوحة التحكم</b><div class="actions"><button id="goGame" class="btn small">الانتقال إلى اللعبة</button><button id="changePassword" class="btn small">تغيير كلمة المرور</button><button id="backToPlayerLogin" class="btn small">العودة لدخول اللاعبين</button><button id="logout" class="btn red small">تسجيل الخروج</button></div></header><div class="content">
  <section class="page active" data-page="dashboard"><div class="head"><h1>نظرة عامة</h1><button class="btn small" onclick="loadAll()">تحديث</button></div><div id="stats" class="stats"></div></section>
  <section class="page" data-page="categories"><div class="head"><h1>إدارة الفئات</h1><button class="btn gold" onclick="categoryDialog()">إضافة فئة</button></div><div id="categoriesTable"></div></section>
  <section class="page" data-page="questions"><div class="head"><h1>مخزون الأسئلة</h1><button class="btn gold" onclick="questionDialog()">إضافة سؤال</button></div><div class="toolbar"><select id="qCategory" class="field" onchange="renderQuestions()"><option value="">كل الفئات</option></select><select id="qPoints" class="field" onchange="renderQuestions()"><option value="">كل النقاط</option><option>100</option><option>300</option><option>500</option></select><select id="qStatus" class="field" onchange="renderQuestions()"><option value="">كل الحالات</option><option value="active">مفعّل</option><option value="disabled">معطّل</option><option value="draft">مسودة</option></select><input id="qSearch" class="field" placeholder="بحث في الأسئلة" oninput="renderQuestions()"><button class="btn green" onclick="reactivateFiltered()">إعادة تفعيل المعطلة</button></div><div id="questionsTable"></div></section>
  <section class="page" data-page="media"><div class="head"><h1>مكتبة الوسائط</h1><button class="btn gold" onclick="mediaDialog()">رفع وسيط</button></div><div id="mediaTable"></div></section>
  <section class="page" data-page="users"><div class="head"><h1>حسابات اللاعبين</h1></div><div id="usersTable"></div></section>
  <section class="page" data-page="reports"><div class="head"><h1>بلاغات المحتوى</h1></div><div id="reportsTable"></div></section>
  <section class="page" data-page="sessions"><div class="head"><h1>جلسات اللعب</h1></div><div id="sessionsTable"></div></section>
  <section class="page" data-page="recycle"><div class="head"><h1>سلة المحذوفات</h1></div><div id="recycleTable"></div></section>
  <section class="page" data-page="audit"><div class="head"><h1>سجل الأدمن</h1></div><div id="auditTable"></div></section>
</div></main></section><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://qkacbcpcezsevhrkiirb.supabase.co';
const SUPABASE_KEY='sb_publishable_BzxkT4zQCP8mYvjtqOqD4w_FWb4Em9h';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const pages=[['dashboard','لوحة التحكم'],['categories','الفئات'],['questions','الأسئلة'],['media','الوسائط'],['users','الحسابات'],['reports','البلاغات'],['sessions','جلسات اللعب'],['recycle','المحذوفات'],['audit','سجل الأدمن']];
let state={categories:[],questions:[],answers:[],media:[],profiles:[],reports:[],sessions:[],recycle:[],audit:[],user:null};
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg,bad=false){const e=$('#toast');e.textContent=msg;e.style.background=bad?'#8f1d18':'#132c47';e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}
function modal(html){$('#modal').innerHTML='<div class="dialog">'+html+'</div>';$('#modal').classList.remove('hidden')} function closeModal(){$('#modal').classList.add('hidden');$('#modal').innerHTML=''}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات</td></tr>`}</tbody></table></div>`}
async function audit(action,type,id,oldData=null,newData=null){await db.from('admin_audit_log').insert({admin_id:state.user.id,action,entity_type:type,entity_id:String(id||''),old_data:oldData,new_data:newData})}
async function isAdmin(user){const {data,error}=await db.from('admin_users').select('user_id,role,active').eq('user_id',user.id).eq('active',true).maybeSingle();return !error&&!!data}
function unifiedLogin(){localStorage.removeItem('almajlis_auth_route');localStorage.removeItem('almajlis_remember');sessionStorage.removeItem('almajlis_session_only');window.location.replace('index.html?login=1')}
async function boot(){const {data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session)return unifiedLogin();if(!(await isAdmin(session.user))){await db.auth.signOut();return unifiedLogin()}state.user=session.user;$('#adminLoading').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();await loadAll()}
$('#adminLoadBack').onclick=unifiedLogin;
$('#logout').onclick=async()=>{await db.auth.signOut();unifiedLogin()};
$('#backToPlayerLogin').onclick=async()=>{await db.auth.signOut();unifiedLogin()};
$('#changePassword').onclick=()=>{modal(`<div class="head"><h2>تغيير كلمة المرور</h2><button class="btn red small" onclick="closeModal()">إغلاق</button></div><form id="passwordForm"><label>كلمة المرور الجديدة</label><input name="password" class="field" type="password" minlength="8" required><label>تأكيد كلمة المرور</label><input name="confirm" class="field" type="password" minlength="8" required><button class="btn gold" style="width:100%;margin-top:16px">حفظ كلمة المرور</button></form>`);$('#passwordForm').onsubmit=updatePassword};
async function updatePassword(e){e.preventDefault();const f=new FormData(e.target),password=String(f.get('password')),confirm=String(f.get('confirm'));if(password.length<8)return toast('كلمة المرور يجب أن تتكون من 8 أحرف على الأقل',true);if(password!==confirm)return toast('كلمتا المرور غير متطابقتين',true);const {error}=await db.auth.updateUser({password});if(error)return toast('تعذر تغيير كلمة المرور: '+error.message,true);closeModal();toast('تم تغيير كلمة المرور بنجاح')}
$('#goGame').onclick=()=>{window.location.href='index.html?game=1'};
function buildNav(){const n=$('#nav');n.innerHTML=pages.map((p,i)=>`<button class="${i?'':'active'}" data-go="${p[0]}">${p[1]}</button>`).join('');n.onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.dataset.page===b.dataset.go));$('#pageTitle').textContent=pages.find(x=>x[0]===b.dataset.go)[1]}}
async function get(name,order='created_at'){const {data,error}=await db.from(name).select('*').order(order,{ascending:false}).limit(1000);if(error){console.warn(name,error);return[]}return data||[]}
async function loadAll(){try{const [categories,questions,answers,media,profiles,reports,sessions,recycle,auditLog]=await Promise.all([get('categories','sort_order'),get('questions'),get('answers'),get('media_assets'),get('profiles'),get('content_reports'),get('game_sessions','started_at'),get('recycle_bin','deleted_at'),get('admin_audit_log')]);Object.assign(state,{categories,questions,answers,media,profiles,reports,sessions,recycle,audit:auditLog});renderAll();toast('تم تحديث البيانات')}catch(e){toast(e.message,true)}}
function renderAll(){renderStats();renderCategories();fillCategoryFilters();renderQuestions();renderMedia();renderUsers();renderReports();renderSessions();renderRecycle();renderAudit()}
function renderStats(){const active=state.questions.filter(x=>x.status==='active').length;$('#stats').innerHTML=[['الفئات المفعّلة',state.categories.filter(x=>x.is_active).length],['الأسئلة المفعّلة',active],['اللاعبون',state.profiles.length],['جلسات اللعب',state.sessions.length],['البلاغات المفتوحة',state.reports.filter(x=>x.status!=='resolved').length],['الوسائط',state.media.length],['الأسئلة المعطلة',state.questions.filter(x=>x.status==='disabled').length],['المحذوفات',state.recycle.filter(x=>!x.restored_at).length]].map(x=>`<div class="card stat"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}
function renderCategories(){const rows=state.categories.map(c=>`<tr><td>${esc(c.name_ar)}</td><td>${esc(c.slug)}</td><td>${state.questions.filter(q=>q.category_id===c.id).length}</td><td><span class="badge ${c.is_active?'on':'off'}">${c.is_active?'مفعّلة':'معطلة'}</span></td><td class="actions"><button class="btn small" onclick="categoryDialog('${c.id}')">تعديل</button><button class="btn ${c.is_active?'red':'green'} small" onclick="toggleCategory('${c.id}',${!c.is_active})">${c.is_active?'تعطيل':'تفعيل'}</button></td></tr>`).join('');$('#categoriesTable').innerHTML=table(['الفئة','المعرّف','الأسئلة','الحالة','الإجراءات'],rows)}
function categoryDialog(id=''){const c=state.categories.find(x=>x.id===id)||{};modal(`<div class="head"><h2>${id?'تعديل':'إضافة'} فئة</h2><button class="btn red small" onclick="closeModal()">إغلاق</button></div><form id="catForm" class="grid2"><div><label>اسم الفئة</label><input name="name_ar" class="field" value="${esc(c.name_ar)}" required></div><div><label>المعرّف الإنجليزي</label><input name="slug" class="field" value="${esc(c.slug)}" required></div><div class="wide"><label>الوصف</label><textarea name="description_ar" class="field">${esc(c.description_ar)}</textarea></div><div class="wide"><label>رابط صورة الغلاف</label><input name="cover_url" class="field" value="${esc(c.cover_url)}"></div><div><label>الترتيب</label><input name="sort_order" type="number" class="field" value="${c.sort_order??0}"></div><div><label>الحالة</label><select name="is_active" class="field"><option value="true" ${c.is_active!==false?'selected':''}>مفعّلة</option><option value="false" ${c.is_active===false?'selected':''}>معطلة</option></select></div><button class="btn gold wide">حفظ</button></form>`);$('#catForm').onsubmit=e=>saveCategory(e,id,c)}
async function saveCategory(e,id,old){e.preventDefault();const f=new FormData(e.target),v={name_ar:f.get('name_ar').trim(),slug:f.get('slug').trim(),description_ar:f.get('description_ar')||null,cover_url:f.get('cover_url')||null,sort_order:+f.get('sort_order'),is_active:f.get('is_active')==='true'};const q=id?db.from('categories').update(v).eq('id',id):db.from('categories').insert(v).select().single();const {data,error}=await q;if(error)return toast(error.message,true);await audit(id?'update':'create','category',id||data?.id,old,v);closeModal();await loadAll()}
async function toggleCategory(id,value){const old=state.categories.find(x=>x.id===id);const {error}=await db.from('categories').update({is_active:value}).eq('id',id);if(error)return toast(error.message,true);await audit(value?'activate':'disable','category',id,old,{is_active:value});await loadAll()}
function fillCategoryFilters(){const opts=state.categories.map(c=>`<option value="${c.id}">${esc(c.name_ar)}</option>`).join('');const s=$('#qCategory'),v=s.value;s.innerHTML='<option value="">كل الفئات</option>'+opts;s.value=v}
function filteredQuestions(){const c=$('#qCategory').value,p=$('#qPoints').value,st=$('#qStatus').value,s=$('#qSearch').value.trim();return state.questions.filter(q=>(!c||q.category_id===c)&&(!p||String(q.points)===p)&&(!st||q.status===st)&&(!s||q.question_text.includes(s)))}
function renderQuestions(){const el=$('#questionsTable');if(!el)return;const rows=filteredQuestions().map(q=>{const c=state.categories.find(x=>x.id===q.category_id),a=state.answers.filter(x=>x.question_id===q.id).map(x=>x.answer_text).join('، ');return `<tr><td>${esc(c?.name_ar||'—')}</td><td>${q.points}</td><td>${esc(q.question_text)}</td><td>${esc(a)}</td><td><span class="badge ${q.status==='active'?'on':'off'}">${esc(q.status)}</span></td><td class="actions"><button class="btn small" onclick="questionDialog('${q.id}')">تعديل</button><button class="btn ${q.status==='active'?'red':'green'} small" onclick="setQuestionStatus('${q.id}','${q.status==='active'?'disabled':'active'}')">${q.status==='active'?'تعطيل':'تفعيل'}</button><button class="btn red small" onclick="softDeleteQuestion('${q.id}')">حذف آمن</button></td></tr>`}).join('');el.innerHTML=table(['الفئة','النقاط','السؤال','الإجابة','الحالة','الإجراءات'],rows)}
function questionDialog(id=''){const q=state.questions.find(x=>x.id===id)||{},ans=state.answers.find(x=>x.question_id===id&&x.is_primary)||state.answers.find(x=>x.question_id===id)||{};modal(`<div class="head"><h2>${id?'تعديل':'إضافة'} سؤال</h2><button class="btn red small" onclick="closeModal()">إغلاق</button></div><form id="questionForm" class="grid2"><div><label>الفئة</label><select name="category_id" class="field" required>${state.categories.map(c=>`<option value="${c.id}" ${q.category_id===c.id?'selected':''}>${esc(c.name_ar)}</option>`).join('')}</select></div><div><label>النقاط</label><select name="points" class="field"><option ${q.points===100?'selected':''}>100</option><option ${q.points===300?'selected':''}>300</option><option ${q.points===500?'selected':''}>500</option></select></div><div class="wide"><label>نص السؤال</label><textarea name="question_text" class="field" rows="4" required>${esc(q.question_text)}</textarea></div><div class="wide"><label>الإجابة الأساسية</label><input name="answer_text" class="field" value="${esc(ans.answer_text)}" required></div><div class="wide"><label>الشرح</label><textarea name="explanation" class="field">${esc(q.explanation)}</textarea></div><div><label>المصدر</label><input name="source_reference" class="field" value="${esc(q.source_reference)}"></div><div><label>الحالة</label><select name="status" class="field"><option value="draft" ${q.status==='draft'?'selected':''}>مسودة</option><option value="active" ${q.status==='active'?'selected':''}>مفعّل</option><option value="disabled" ${q.status==='disabled'?'selected':''}>معطّل</option></select></div><div class="wide"><label>ملاحظات الجودة</label><textarea name="quality_notes" class="field">${esc(q.quality_notes)}</textarea></div><button class="btn gold wide">حفظ السؤال</button></form>`);$('#questionForm').onsubmit=e=>saveQuestion(e,id,q,ans)}
async function saveQuestion(e,id,old,oldAns){e.preventDefault();const f=new FormData(e.target),v={category_id:f.get('category_id'),question_text:f.get('question_text').trim(),points:+f.get('points'),status:f.get('status'),explanation:f.get('explanation')||null,source_reference:f.get('source_reference')||null,quality_notes:f.get('quality_notes')||null};let qid=id;if(id){const {error}=await db.from('questions').update(v).eq('id',id);if(error)return toast(error.message,true)}else{v.created_by=state.user.id;const {data,error}=await db.from('questions').insert(v).select().single();if(error)return toast(error.message,true);qid=data.id}const answer={question_id:qid,answer_text:f.get('answer_text').trim(),is_primary:true};let er;if(oldAns.id)({error:er}=await db.from('answers').update({answer_text:answer.answer_text}).eq('id',oldAns.id));else({error:er}=await db.from('answers').insert(answer));if(er)return toast(er.message,true);await audit(id?'update':'create','question',qid,old,v);closeModal();await loadAll()}
async function setQuestionStatus(id,status){const old=state.questions.find(x=>x.id===id);const {error}=await db.from('questions').update({status}).eq('id',id);if(error)return toast(error.message,true);await audit(status,'question',id,old,{status});await loadAll()}
async function reactivateFiltered(){const ids=filteredQuestions().filter(x=>x.status==='disabled').map(x=>x.id);if(!ids.length)return toast('لا توجد أسئلة معطلة ضمن الاختيار');const {error}=await db.from('questions').update({status:'active'}).in('id',ids);if(error)return toast(error.message,true);await audit('bulk_reactivate','question',ids.join(','),null,{count:ids.length});await loadAll()}
async function softDeleteQuestion(id){const q=state.questions.find(x=>x.id===id),a=state.answers.filter(x=>x.question_id===id),m=state.media.filter(x=>x.question_id===id);const {error}=await db.from('recycle_bin').insert({entity_type:'question',entity_id:id,snapshot:{question:q,answers:a,media:m},deleted_by:state.user.id});if(error)return toast(error.message,true);await setQuestionStatus(id,'disabled');await audit('soft_delete','question',id,q,null)}
function renderMedia(){const rows=state.media.map(m=>`<tr><td>${esc(m.title||'—')}</td><td>${esc(m.kind)}</td><td>${m.points||'—'}</td><td>${esc(state.categories.find(c=>c.id===m.category_id)?.name_ar||'—')}</td><td><span class="badge ${m.is_active?'on':'off'}">${m.is_active?'مفعّل':'معطّل'}</span></td><td><button class="btn ${m.is_active?'red':'green'} small" onclick="toggleMedia('${m.id}',${!m.is_active})">${m.is_active?'تعطيل':'تفعيل'}</button></td></tr>`).join('');$('#mediaTable').innerHTML=table(['العنوان','النوع','النقاط','الفئة','الحالة','الإجراء'],rows)}
function mediaDialog(){modal(`<div class="head"><h2>رفع وسيط</h2><button class="btn red small" onclick="closeModal()">إغلاق</button></div><form id="mediaForm" class="grid2"><div><label>الفئة</label><select name="category_id" class="field">${state.categories.map(c=>`<option value="${c.id}">${esc(c.name_ar)}</option>`).join('')}</select></div><div><label>النقاط</label><select name="points" class="field"><option>100</option><option>300</option><option>500</option></select></div><div><label>النوع</label><select name="kind" class="field"><option value="image">صورة</option><option value="audio">صوت</option><option value="video">فيديو</option></select></div><div><label>العنوان</label><input name="title" class="field" required></div><div class="wide"><label>الملف</label><input name="file" type="file" class="field" required></div><div class="wide"><label>النص البديل</label><input name="alt_text_ar" class="field"></div><div><label>مدة المقطع بالثواني</label><input name="duration_seconds" type="number" step="0.1" class="field"></div><div><label>بداية المقطع بالثواني</label><input name="start_offset_seconds" type="number" step="0.1" class="field"></div><button class="btn gold wide">رفع وحفظ</button></form>`);$('#mediaForm').onsubmit=uploadMedia}
async function uploadMedia(e){e.preventDefault();const f=new FormData(e.target),file=f.get('file'),path=`${f.get('category_id')}/${Date.now()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const {error:upErr}=await db.storage.from('question-media').upload(path,file,{upsert:false});if(upErr)return toast(upErr.message,true);const {data:u}=db.storage.from('question-media').getPublicUrl(path);const row={category_id:f.get('category_id'),points:+f.get('points'),kind:f.get('kind'),storage_bucket:'question-media',storage_path:path,public_url:u.publicUrl,title:f.get('title'),alt_text_ar:f.get('alt_text_ar')||null,duration_seconds:f.get('duration_seconds')||null,start_offset_seconds:f.get('start_offset_seconds')||null,is_active:true,created_by:state.user.id};const {data,error}=await db.from('media_assets').insert(row).select().single();if(error)return toast(error.message,true);await audit('upload','media_asset',data.id,null,row);closeModal();await loadAll()}
async function toggleMedia(id,value){const {error}=await db.from('media_assets').update({is_active:value}).eq('id',id);if(error)return toast(error.message,true);await audit(value?'activate':'disable','media_asset',id,null,{is_active:value});await loadAll()}
function renderUsers(){const rows=state.profiles.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.country||'—')}</td><td>${esc(u.phone||'—')}</td><td>${u.games_played}</td><td><span class="badge ${u.state==='active'?'on':'off'}">${esc(u.state)}</span></td></tr>`).join('');$('#usersTable').innerHTML=table(['الاسم','البريد','الدولة','الهاتف','الألعاب','الحالة'],rows)}
function renderReports(){const rows=state.reports.map(r=>`<tr><td>${esc(r.reason)}</td><td>${esc(r.details||'—')}</td><td>${esc(r.status)}</td><td>${new Date(r.created_at).toLocaleString('ar')}</td><td><button class="btn green small" onclick="resolveReport('${r.id}')">إغلاق البلاغ</button></td></tr>`).join('');$('#reportsTable').innerHTML=table(['السبب','التفاصيل','الحالة','التاريخ','الإجراء'],rows)}
async function resolveReport(id){const {error}=await db.from('content_reports').update({status:'resolved',resolved_by:state.user.id,resolved_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,true);await audit('resolve','content_report',id);await loadAll()}
function renderSessions(){const rows=state.sessions.map(s=>`<tr><td>${esc(s.team_one_name||'الفريق الأول')} (${s.team_one_score})</td><td>${esc(s.team_two_name||'الفريق الثاني')} (${s.team_two_score})</td><td>${new Date(s.started_at).toLocaleString('ar')}</td><td>${s.finished_at?'مكتملة':'جارية'}</td></tr>`).join('');$('#sessionsTable').innerHTML=table(['الفريق الأول','الفريق الثاني','البداية','الحالة'],rows)}
function renderRecycle(){const rows=state.recycle.filter(x=>!x.restored_at).map(r=>`<tr><td>${esc(r.entity_type)}</td><td>${esc(r.entity_id)}</td><td>${new Date(r.deleted_at).toLocaleString('ar')}</td><td><button class="btn green small" onclick="restoreItem('${r.id}')">استعادة</button></td></tr>`).join('');$('#recycleTable').innerHTML=table(['النوع','المعرّف','تاريخ الحذف','الإجراء'],rows)}
async function restoreItem(id){const r=state.recycle.find(x=>x.id===id);if(r.entity_type==='question'&&r.snapshot?.question){const q=r.snapshot.question;delete q.updated_at;const {error}=await db.from('questions').upsert({...q,status:'active'});if(error)return toast(error.message,true);if(r.snapshot.answers?.length){const {error:a}=await db.from('answers').upsert(r.snapshot.answers);if(a)return toast(a.message,true)}}const {error}=await db.from('recycle_bin').update({restored_at:new Date().toISOString(),restored_by:state.user.id}).eq('id',id);if(error)return toast(error.message,true);await audit('restore',r.entity_type,r.entity_id);await loadAll()}
function renderAudit(){const rows=state.audit.map(a=>`<tr><td>${esc(a.action)}</td><td>${esc(a.entity_type)}</td><td>${esc(a.entity_id||'—')}</td><td>${new Date(a.created_at).toLocaleString('ar')}</td></tr>`).join('');$('#auditTable').innerHTML=table(['الإجراء','النوع','المعرّف','التاريخ'],rows)}
boot().catch(e=>{$('#adminLoadMsg').textContent='تعذر فتح لوحة الإدارة: '+(e?.message||'خطأ غير معروف');$('#adminLoadBack').classList.remove('hidden')});
</script></body></html>
