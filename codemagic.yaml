workflows:
  ios-validation:
    name: Almajlis iOS Validation
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      node: lts
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Build iOS Simulator
        script: |
          cd ios/App

          if [ -d "App.xcworkspace" ]; then
            PROJECT_OPTION=(-workspace App.xcworkspace)
          elif [ -d "App.xcodeproj" ]; then
            PROJECT_OPTION=(-project App.xcodeproj)
          else
            echo "Neither App.xcworkspace nor App.xcodeproj was found"
            exit 1
          fi

          xcodebuild "${PROJECT_OPTION[@]}" \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Almajlis iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Almajlis Codemagic"

    environment:
      node: lts
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.abdullahalibrahim.almajlis

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Apply Apple signing
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            --scheme "App"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
